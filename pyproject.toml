[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tnesty-datasim_jd497"
version = "0.1.0"
description = "从样本里推断数据合成与仿真工程师·算子融合的收益边界应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "tnesty" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://tnesty.github.io"
Repository = "https://github.com/tnesty/datasim_jd497"
Issues = "https://github.com/tnesty/datasim_jd497/issues"

[project.scripts]
datasim_jd497 = "datasim_jd497:main"

[tool.setuptools]
py-modules = ["datasim_jd497"]
